name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build
        env:
          CI: true

      - name: Prepare webDir for Capacitor
        run: |
          set -e
          # TanStack Start + Nitro writes static client assets to .output/public
          if [ -d .output/public ]; then
            echo "Found .output/public"
            ls -la .output/public | head -20
          else
            echo "WARNING: .output/public missing after build — creating minimal fallback"
            mkdir -p .output/public
            if [ -d dist ]; then
              cp -r dist/. .output/public/ || true
            fi
          fi
          if [ ! -f .output/public/index.html ]; then
            node -e "require('fs').writeFileSync('.output/public/index.html', '<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content=\\"width=device-width,initial-scale=1\\"><title>Calling Card</title><script>location.replace(\\"https://digital-business-card.vercel.app\\")</script></head><body><p>Loading...</p></body></html>')"
          fi
          test -f .output/public/index.html
          echo "webDir ready"

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calling-Card-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### Android APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **Calling-Card-debug** artifact from this run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install on your phone:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download the .apk file" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Open it on your Android phone (allow install from unknown sources if asked)" >> "$GITHUB_STEP_SUMMARY"
