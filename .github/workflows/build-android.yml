name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build
        env:
          CI: true

      - name: Prepare webDir for Capacitor
        run: |
          set -e
          if [ -d .vercel/output/static ]; then
            echo "Found .vercel/output/static"
            mkdir -p .output/public
            cp -r .vercel/output/static/. .output/public/
          elif [ -d .output/public ]; then
            echo "Found .output/public"
          else
            echo "WARNING: no static output dir — creating minimal fallback"
            mkdir -p .output/public
            if [ -d dist ]; then
              cp -r dist/. .output/public/ || true
            fi
          fi
          ls -la .output/public | head -20 || true
          if [ ! -f .output/public/index.html ]; then
            node -e "require('fs').writeFileSync('.output/public/index.html', '<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content=\\"width=device-width,initial-scale=1\\"><title>Calling Card</title><script>location.replace(\\"https://digital-business-card-samuelchristopher344-beep.vercel.app\\")</script></head><body><p>Loading...</p></body></html>')"
          fi
          test -f .output/public/index.html
          echo "webDir ready"

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Grant camera permission in AndroidManifest
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          if "android.permission.CAMERA" not in text:
              text = re.sub(
                  r"(<manifest[^>]*>)",
                  r"""\1
      <uses-permission android:name="android.permission.CAMERA" />
      <uses-permission android:name="android.permission.INTERNET" />
      <uses-feature android:name="android.hardware.camera" android:required="false" />
      <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />""",
                  text,
                  count=1,
              )
              p.write_text(text)
              print("Patched CAMERA permission into AndroidManifest.xml")
          else:
              print("CAMERA permission already present")
          print(p.read_text()[:800])
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calling-Card-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### Android APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **Calling-Card-debug** artifact from this run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Camera permission is included. On first Scan QR, allow Camera when Android asks." >> "$GITHUB_STEP_SUMMARY"
