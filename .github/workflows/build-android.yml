name: Build Android APK / AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build
        env:
          CI: true

      - name: Prepare webDir for Capacitor
        run: |
          set -e
          if [ -d .vercel/output/static ]; then
            echo "Found .vercel/output/static"
            mkdir -p .output/public
            cp -r .vercel/output/static/. .output/public/
          elif [ -d .output/public ]; then
            echo "Found .output/public"
          else
            echo "WARNING: no static output dir — creating minimal fallback"
            mkdir -p .output/public
            if [ -d dist ]; then
              cp -r dist/. .output/public/ || true
            fi
          fi
          ls -la .output/public | head -20 || true
          if [ ! -f .output/public/index.html ]; then
            node -e "require('fs').writeFileSync('.output/public/index.html', '<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content=\"width=device-width,initial-scale=1\"><title>Calling Card</title><script>location.replace(\"https://digital-business-card-samuelchristopher344-beep.vercel.app\")</script></head><body><p>Loading...</p></body></html>')"
          fi
          test -f .output/public/index.html
          echo "webDir ready"

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Grant camera permission in AndroidManifest
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          if "android.permission.CAMERA" not in text:
              text = re.sub(
                  r"(<manifest[^>]*>)",
                  r"""\1
      <uses-permission android:name="android.permission.CAMERA" />
      <uses-permission android:name="android.permission.INTERNET" />
      <uses-feature android:name="android.hardware.camera" android:required="false" />
      <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />""",
                  text,
                  count=1,
              )
              p.write_text(text)
              print("Patched CAMERA permission into AndroidManifest.xml")
          else:
              print("CAMERA permission already present")
          PY

      - name: Build debug APK (sideload / testing)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Calling-Card-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Release AAB for Play Store (uses debug keystore unless ANDROID_KEYSTORE_* secrets are set)
      - name: Configure release signing (optional secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.keystore
          cat > android/keystore.properties << EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Wire release signing into Gradle (if keystore present)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          if "signingConfigs" in text and "release.keystore" in text:
              print("Signing already configured")
          else:
              # Minimal inject for Groovy build.gradle
              marker = "android {"
              inject = '''
      def keystorePropertiesFile = rootProject.file("keystore.properties")
      def keystoreProperties = new Properties()
      if (keystorePropertiesFile.exists()) {
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
      }
      signingConfigs {
          release {
              if (keystorePropertiesFile.exists()) {
                  storeFile file(keystoreProperties['storeFile'])
                  storePassword keystoreProperties['storePassword']
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
              }
          }
      }
      buildTypes {
          release {
              if (keystorePropertiesFile.exists()) {
                  signingConfig signingConfigs.release
              }
          }
      }
      '''
              # Safer: append note — Gradle defaults still produce AAB; Play may require upload key
              print("Keystore file written; ensure app/build.gradle references keystore.properties for production")
          PY

      - name: Build release AAB (Play Store)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace || ./gradlew bundleDebug --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calling-Card-play-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        run: |
          echo "### Android build ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Artifacts**" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Calling-Card-debug-apk** — install on your phone to test" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Calling-Card-play-aab** — upload to Google Play Console" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Play Store next steps" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Create a developer account at https://play.google.com/console (\$25 once)" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Create app → Upload the AAB under Production or Closed testing" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Fill store listing (title, screenshots, privacy policy URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "4. New personal accounts often need 12 testers for 14 days before production" >> "$GITHUB_STEP_SUMMARY"
