name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build
        env:
          CI: true

      - name: Ensure webDir exists
        run: |
          if [ ! -d .output/public ]; then
            mkdir -p .output/public
            cat > .output/public/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Calling Card</title>
            <script>window.location.replace('https://digital-business-card-samuelchristopher344-beep.vercel.app');</script>
          </head>
          <body><p>Loading Calling Card…</p></body>
          </html>
          EOF
          fi

      - name: Add iOS platform & sync
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iOS (Simulator — no signing required)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate .app bundle
        id: app
        run: |
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -1)
          echo "Found: $APP_PATH"
          echo "path=$APP_PATH" >> $GITHUB_OUTPUT
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi

      - name: Zip simulator app
        run: |
          cd "$(dirname "${{ steps.app.outputs.path }}")"
          zip -r "$GITHUB_WORKSPACE/Calling-Card-ios-simulator.zip" "$(basename "${{ steps.app.outputs.path }}")"

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calling-Card-ios-simulator
          path: Calling-Card-ios-simulator.zip
          retention-days: 30

      - name: Summary
        run: |
          echo "### iOS build ready (Simulator)" >> $GITHUB_STEP_SUMMARY
          echo "Download **Calling-Card-ios-simulator** from this run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This is a **simulator** build (no Apple Developer account required)." >> $GITHUB_STEP_SUMMARY
          echo "To install on a real iPhone or publish to the App Store you need:" >> $GITHUB_STEP_SUMMARY
          echo "1. Apple Developer Program (\$99/year)" >> $GITHUB_STEP_SUMMARY
          echo "2. Signing certificates + provisioning profile" >> $GITHUB_STEP_SUMMARY
          echo "3. Open the project on a Mac: \\'npx cap open ios\\'" >> $GITHUB_STEP_SUMMARY
